{% extends "base.html" %}
{# Centered card layout for login / setup pages. #}

{% block body %}
<div class="auth">
  <div class="auth__card">
    <div class="auth__brand">
      <div class="sidebar__logo">R</div>
      <div class="sidebar__title">Registry<small>OCI Distribution</small></div>
    </div>
    <div class="card">
      <div class="card__body">
        {% block content %}{% endblock %}
      </div>
    </div>
    <p class="small faint mt-2" style="text-align:center">{% block auth_footer %}Self-hosted container registry{% endblock %}</p>
  </div>
</div>
{% endblock %}
