{# Usage: {% include "components/stat_card.html" with id="stat-repos" label="Repositories" %} #}
<div class="card stat">
  <div class="stat__label">{{ label }}</div>
  <div class="stat__value" id="{{ id }}"><span class="skeleton">0000</span></div>
  <div class="stat__delta" id="{{ id }}-delta"></div>
</div>
