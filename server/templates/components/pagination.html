{# Usage: {% include "components/pagination.html" with id="repos" %} → JS fills #repos-page-info and binds prev/next #}
<div class="pagination" id="{{ id }}-pagination">
  <span class="info" id="{{ id }}-page-info">—</span>
  <button class="btn btn--sm" id="{{ id }}-prev" disabled>Previous</button>
  <button class="btn btn--sm" id="{{ id }}-next" disabled>Next</button>
</div>
