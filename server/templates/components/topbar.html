{# Top bar: mobile menu, global search, theme toggle, user menu. #}
<header class="topbar">
  <button class="btn btn--ghost btn--icon menu-btn" data-toggle-sidebar aria-label="Menu"><i data-icon="menu"></i></button>

  <div class="topbar__search">
    <i data-icon="search"></i>
    <input class="input" id="global-search" type="search" placeholder="Search repositories, tags, digests…  (/)" autocomplete="off">
  </div>

  <div class="topbar__spacer"></div>

  <div class="topbar__actions">
    <button class="btn btn--ghost btn--icon" data-toggle-theme title="Toggle theme"><i data-icon="sun"></i></button>

    <div class="dropdown">
      <button class="avatar" data-dropdown id="topbar-avatar" title="Account">?</button>
      <div class="dropdown__menu">
        <div class="dropdown__item" style="cursor:default">
          <div><div id="topbar-username" class="truncate">—</div><div class="small faint" id="topbar-role">—</div></div>
        </div>
        <div class="dropdown__sep"></div>
        <a class="dropdown__item" href="{% url 'ui:settings' %}"><i data-icon="settings"></i> Settings</a>
        <a class="dropdown__item" href="/v2/" target="_blank"><i data-icon="external"></i> Registry API</a>
        <div class="dropdown__sep"></div>
        <button class="dropdown__item danger" data-logout><i data-icon="x"></i> Sign out</button>
      </div>
    </div>
  </div>
</header>
