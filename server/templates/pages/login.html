{% extends "layouts/auth.html" %}
{% load static %}
{% block title %}Sign in{% endblock %}

{% block content %}
<h2>Sign in</h2>
<p class="muted mt-1">Use your registry credentials.</p>

<form id="login-form" class="stack mt-3" autocomplete="on">
  <div class="field">
    <label for="username">Username</label>
    <input class="input" id="username" name="username" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input class="input" id="password" name="password" type="password" required>
  </div>
  <div class="alert alert--danger hidden" id="login-error"><i data-icon="alert"></i><div class="alert__body" id="login-error-text"></div></div>
  <button class="btn btn--primary" type="submit" id="login-submit" style="justify-content:center">Sign in</button>
</form>

<div class="mt-3">
  <p class="small faint">Pushing from the CLI?</p>
  <div class="codeblock mt-1">docker login <span id="registry-host">registry.example.com</span></div>
</div>
{% endblock %}

{% block scripts %}<script src="{% static 'js/pages/login.js' %}"></script>{% endblock %}
